<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07060f"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>Cyber Web</title>
<style>
:root{--p:#8b5cf6;--p2:#ff2bd6;--bg:#07060f;--card:#100e1c;--line:#2a2450;--fg:#ece9ff;--mut:#8b86ad;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,Roboto,sans-serif;min-height:100dvh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(420px 420px at 100% 0,color-mix(in srgb,var(--p) 22%,transparent),transparent 70%),linear-gradient(#ffffff08 1px,transparent 1px) 0 0/36px 36px,linear-gradient(90deg,#ffffff08 1px,transparent 1px) 0 0/36px 36px}
main{padding:calc(14px + env(safe-area-inset-top)) 18px 150px;max-width:640px;margin:0 auto}
h1{font:900 30px/1 system-ui;letter-spacing:.14em;margin:6px 0;color:var(--p);text-shadow:2px 0 var(--p2),-2px 0 #fcee0a55;animation:gl 5s infinite steps(1)}
@keyframes gl{0%,94%,100%{transform:none}95%{transform:translate(-3px,1px) skewX(5deg)}97%{transform:translate(3px,0)}}
h2{margin:14px 0 2px;font-size:22px}.sub{color:var(--mut);font:12px monospace;letter-spacing:.2em;text-transform:uppercase;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px}
.stats{display:flex;text-align:center;margin-bottom:16px}.stats div{flex:1;border-left:1px solid var(--line)}.stats div:first-child{border:0}
.stats b{display:block;font-size:30px;color:var(--p)}.stats span{font:11px monospace;letter-spacing:.25em;color:var(--mut)}
input,textarea,select{width:100%;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:16px;padding:14px;font:inherit;outline:0}
input:focus,textarea:focus{border-color:var(--p)}
.sec{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px;font:700 14px monospace;letter-spacing:.25em;color:var(--fg)}
.sec span::before{content:"";display:inline-block;width:4px;height:16px;background:var(--p);border-radius:2px;margin-right:12px;vertical-align:-3px}
.sec a,.sec b{color:var(--p);font-weight:700;cursor:pointer}
.fl{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}.fc{flex:none;min-width:130px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:14px;cursor:pointer}
.fc.on{border-color:var(--p);box-shadow:0 0 16px color-mix(in srgb,var(--p) 40%,transparent)}.fc b{display:block}.fc small{color:var(--p);font-family:monospace}
.note{display:block;margin-bottom:10px;cursor:pointer}.note b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.note p{margin:4px 0 0;color:var(--mut);font-size:14px;max-height:42px;overflow:hidden}.note small{color:var(--p);font:11px monospace}
.empty{text-align:center;color:var(--mut);padding:36px 10px}.empty i{display:grid;place-items:center;width:110px;height:110px;margin:0 auto 14px;border:1px solid var(--line);border-radius:50%;font-size:42px;font-style:normal;background:var(--card)}
button{font:800 14px system-ui;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;border:1px solid var(--p);background:transparent;color:var(--p);border-radius:18px;padding:15px 18px;width:100%}
button.pri{background:var(--p);color:#0a0714}button.dng{border-color:#ff4d6d;color:#ff4d6d}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0b0916f2;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav a{flex:1;text-align:center;padding:10px 0 8px;font:700 11px monospace;letter-spacing:.18em;color:var(--mut);cursor:pointer}nav a i{display:block;font-size:22px;font-style:normal;margin-bottom:2px}nav a.on{color:var(--p)}
.fab{position:fixed;right:14px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:55;width:62px;height:62px;padding:0;border:0;border-radius:50%;background:#0d0b1acc;filter:drop-shadow(0 0 6px #00f0ff) drop-shadow(0 0 14px #ff2bd6aa)}
.fab svg{width:100%;height:100%;animation:fg 4.5s infinite steps(1)}
.fab .eye{transform-box:fill-box;transform-origin:center;animation:eb 5s infinite}.fab .scan{animation:sx 2.6s linear infinite}
@keyframes fg{0%,90%,100%{transform:none}91%{transform:translate(-2px,1px) skewX(4deg)}93%{transform:translate(2px,-1px)}95%{transform:none}}
@keyframes eb{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}@keyframes sx{from{transform:translateX(12px)}to{transform:translateX(52px)}}
.plus{position:fixed;left:18px;right:96px;width:auto;padding:14px 8px;font-size:13px;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;bottom:calc(88px + env(safe-area-inset-bottom));z-index:25}
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 18px 18px;display:flex;flex-direction:column;gap:10px}
.ov textarea{flex:1;resize:none}.row{display:flex;gap:10px}.row>*{flex:1}
.sheet{position:fixed;inset:0;z-index:60;background:#000a;display:flex;align-items:flex-end}.sheet>div{width:100%;background:var(--card);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--p);display:flex;flex-direction:column;gap:12px}
.dots{display:flex;gap:12px;flex-wrap:wrap}.dots i{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}.dots i.on{border-color:#fff}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px}.sw input{width:50px;height:28px;accent-color:var(--p)}
.hd{display:flex;justify-content:space-between;align-items:center}.hd h1{margin:0}.hb{display:flex;gap:10px}
.ic{position:relative;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-weight:800;color:var(--p);cursor:pointer}
.ic.a{border-color:var(--p);background:color-mix(in srgb,var(--p) 18%,transparent);width:50px;height:50px}.ic svg{width:22px;height:22px;fill:none;stroke:var(--fg);stroke-width:1.8}
.dot{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:#ff4d4d}
.chips{display:flex;gap:10px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:99px;padding:11px 16px;font:800 12px monospace;letter-spacing:.14em;background:var(--card);color:var(--fg);cursor:pointer;text-transform:uppercase}
.chip.on{border-color:var(--p);color:var(--p);background:color-mix(in srgb,var(--p) 14%,transparent)}.chip.off{opacity:.45}
.go{display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-top:10px}.lab{font:11px monospace;letter-spacing:.25em;color:var(--mut)}
.ring{display:grid;place-items:center;flex:none;width:68px;height:68px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--p) 14%,transparent);font-style:normal;font-size:28px}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
.m{max-width:90%;padding:10px 13px;border-radius:16px;font-size:15px;word-break:break-word}.m.u{align-self:flex-end;background:color-mix(in srgb,var(--p2) 18%,transparent);border:1px solid var(--p2)}
.m.a{align-self:flex-start;background:var(--card);border:1px solid var(--line)}.m.s{align-self:center;color:var(--mut);font-size:12px;text-align:center}.m.w{opacity:.6}
.m b{color:#fcee0a}.m pre{background:#05040c;padding:8px;border-radius:10px;overflow:auto;color:#fcee0a;font-size:12px;margin:6px 0}.m code{color:#fcee0a}
.m button,.pc button{width:auto;padding:6px 10px;font-size:10px;letter-spacing:.08em;margin-top:8px;border-radius:12px}.pc{align-self:flex-start;border:1px solid #fcee0a;border-radius:16px;padding:10px 12px;font-size:14px;max-width:92%}
#aiov{z-index:70}.ab{display:flex;gap:8px;align-items:flex-end}.ab textarea{min-height:48px;max-height:120px}.ab button{width:auto;padding:13px 16px}
#aiv{display:none;flex:1;overflow:auto}#aiov.lv #aiv{display:flex;flex-direction:column;gap:10px}#aiov.lv #aim,#aiov.lv .aib,#aiov.lv #aif,#aiov.lv .aii,#aiov.lv #aidn{display:none!important}
.ib{width:52px;height:52px;border-radius:50%;padding:0;display:grid;place-items:center;flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);letter-spacing:0}
.ib svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.s{width:44px;height:44px;border:0;background:transparent}.ib.red{border-color:#7a1f2b;color:#ff6b6b;background:#2a0d14}.ib.on{border-color:var(--p);color:var(--p)}
.ib.send{background:color-mix(in srgb,var(--p) 40%,#2a2850);border:0;color:#fff}.ib.pu{border:0;background:color-mix(in srgb,var(--p) 35%,#1b1a3a);color:var(--p)}
.eh{display:flex;gap:12px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}.et{flex:1;min-width:0}
.et b{display:block;font:900 22px system-ui;letter-spacing:.08em;color:var(--p);text-shadow:2px 0 var(--p2)}.et span{font:800 12px monospace;letter-spacing:.2em;color:#4ade80}
.ov .tt{background:transparent;border:0;border-radius:0;padding:10px 0;font:800 30px/1.2 system-ui}.ov .tt::placeholder{color:var(--mut)}
.fr{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.pill{width:auto;display:flex;gap:10px;align-items:center;border-radius:99px;padding:11px 16px;font:600 16px system-ui;letter-spacing:0;text-transform:none;color:var(--fg);border-color:var(--line);background:var(--card)}
.pill i{width:12px;height:12px;border-radius:50%;background:var(--mut)}
.ed textarea{background:transparent;border:0;border-radius:0;padding:10px 0;font-size:19px}
.hint{border:1px dashed var(--line);border-radius:18px;padding:16px;color:var(--mut);display:flex;gap:12px;align-items:center}.hint svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8}
.eb{display:flex;justify-content:space-around;margin:4px -18px -18px;padding:12px 0 calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#0b0916}
.eb div{text-align:center;font:800 12px monospace;letter-spacing:.2em;color:var(--mut);cursor:pointer}
.eb i{display:grid;place-items:center;width:64px;height:64px;border-radius:22px;border:1px solid var(--line);background:var(--card);margin:0 auto 6px;color:var(--p)}.eb svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.aiw{position:fixed;inset:0;z-index:70;background:#000b;display:flex;align-items:flex-end;padding:10px}
.aip{position:relative;width:100%;max-width:640px;margin:0 auto;height:min(78dvh,760px);display:flex;flex-direction:column;background:linear-gradient(#1b1a3a,#14122b);border:1px solid var(--line);border-radius:36px;padding:14px 14px calc(14px + env(safe-area-inset-bottom));gap:10px;overflow:hidden}
.aih{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 0}.aih>span{color:var(--mut);font-size:20px}.ia{display:flex;gap:4px}
.aib{display:flex;gap:10px;align-items:center}.nw{flex-wrap:nowrap;overflow-x:auto;flex:1}.nw .chip{white-space:nowrap;background:#1f1d40;font:600 15px system-ui;letter-spacing:0;text-transform:none}
.aii{display:flex;gap:8px;align-items:center;background:#201f42;border-radius:99px;padding:6px 6px 6px 18px}.aii input{background:transparent;border:0;padding:8px 0;border-radius:0;font-size:17px}
.m.a{position:relative;margin-left:48px;background:#1d1b3b;border:0;border-radius:22px;font-size:16px;line-height:1.5;max-width:calc(100% - 48px)}
.m.a::before{content:"";position:absolute;left:-48px;top:2px;width:40px;height:40px;border-radius:50%;background:#0d0b1a var(--av) center/78% no-repeat}
.m.u{border:0;border-radius:24px 24px 6px 24px;background:color-mix(in srgb,var(--p) 38%,#161432);font-size:16px}
#aidn{position:absolute;right:18px;bottom:150px;display:none}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--p);color:#0a0714;padding:8px 16px;border-radius:99px;font-weight:700;z-index:99}
</style></head><body>
<main id="m"></main>
<button class="fab" id="ai" aria-label="Netrunner AI"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs><clipPath id="ey"><path d="M12 32Q32 14 52 32Q32 50 12 32Z"/></clipPath></defs>
  <polygon points="32,3 58,18 58,46 32,61 6,46 6,18" fill="none" style="stroke:#ff2bd6" stroke-width="2" transform="translate(-1.6,1)" opacity=".8"/>
  <polygon points="32,3 58,18 58,46 32,61 6,46 6,18" fill="none" style="stroke:#00f0ff" stroke-width="2" transform="translate(1.6,-1)" opacity=".8"/>
  <polygon points="32,3 58,18 58,46 32,61 6,46 6,18" fill="#0b0820" stroke="#fcee0a" stroke-width="2.6"/>
  <path d="M9 24V19L16 15M55 24V19L48 15M9 40v5l7 4M55 40v5l-7 4" fill="none" stroke="#fcee0a" stroke-width="1.4" opacity=".7"/>
  <path d="M12 32Q32 14 52 32Q32 50 12 32Z" fill="#05040c" style="stroke:#00f0ff" stroke-width="2"/>
  <g clip-path="url(#ey)"><rect class="scan" x="0" y="20" width="3" height="24" style="fill:#00f0ff" opacity=".55"/></g>
  <g class="eye"><circle cx="32" cy="32" r="8.5" fill="none" stroke="#fcee0a" stroke-width="2"/><circle cx="32" cy="32" r="3.6" style="fill:#ff2bd6"/>
  <path d="M32 21.5v3.2M32 39.3v3.2M21.5 32h3.2M39.3 32h3.2" stroke="#fcee0a" stroke-width="1.5"/></g>
</svg></button>
<nav id="nav"><a data-t="note"><i>▤</i>NOTE</a><a data-t="cart"><i>▣</i>CARTELLE</a><a data-t="cerca"><i>⌕</i>CERCA</a><a data-t="altro"><i>⠿</i>ALTRO</a></nav>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY="cyberweb.v1";let S={notes:[],folders:[],prefs:{}},tab="note",fsel="",q="",tf=0,ST="",busy=false,pend=false,kt=0;
try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
S.prefs=Object.assign({theme:"viola",slang:true,name:"Runner Locale",push:false,rem:{on:false,time:"20:00"}},S.prefs);
S.cloud=Object.assign({url:"",tok:""},S.cloud);S.del=Object.assign({notes:[],folders:[]},S.del);S.ai=Object.assign({msgs:[],files:[]},S.ai);
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Memoria piena")}};
const save=()=>{persist();kick()};
const TH={viola:["#8b5cf6","#ff2bd6"],ciano:["#00f0ff","#ff2bd6"],rosso:["#ff3355","#00f0ff"],verde:["#39ff88","#ff2bd6"],arancio:["#ff8a2b","#00f0ff"],giallo:["#fcee0a","#ff2bd6"],rosa:["#ff4fd8","#00f0ff"],bianco:["#eef4ff","#8aa0ff"]};
const T=(a,b)=>S.prefs.slang?a:b,uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function theme(){const t=TH[S.prefs.theme]||TH.viola,s=document.documentElement.style;s.setProperty("--p",t[0]);s.setProperty("--p2",t[1])}
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
const greet=()=>{const h=new Date().getHours();return h<6?"Buonanotte":h<13?"Buongiorno":h<19?"Buon pomeriggio":"Buonasera"};
const plain=n=>n.text.replace(/\s+/g," ").trim();
function stats(){return `<div class="card stats"><div><b>${S.notes.length}</b><span>NOTE</span></div><div><b>${S.folders.length}</b><span>CARTELLE</span></div><div><b>${S.fcount||0}</b><span>ALLEGATI</span></div></div>`}
function noteList(arr){return arr.length?arr.map(n=>`<div class="card note" data-n="${n.id}"><b>${n.pin?"📌 ":""}${esc(n.title||"Senza titolo")}</b><p>${esc(plain(n))}</p><small>${new Date(n.updated).toLocaleDateString("it-IT")}</small></div>`).join(""):`<div class="empty"><i>▤</i><h3>${T("Archivio vuoto","Nessuna nota")}</h3><p>${T("Le tue note appariranno qui, choom.","Le tue note appariranno qui.")}</p></div>`}
function filt(){const k=q.toLowerCase();return S.notes.filter(n=>(!fsel||n.folder===fsel)&&(!tf||Date.now()-n.updated<=tf*864e5)&&(!k||(n.title+" "+n.text).toLowerCase().includes(k))).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.updated-a.updated)}
function folderCards(){const c=id=>S.notes.filter(n=>!id||n.folder===id).length;return `<div class="fc ${!fsel?"on":""}" data-f=""><b>Tutte</b><small>${c()} note</small></div>`+S.folders.map(f=>`<div class="fc ${fsel===f.id?"on":""}" data-f="${f.id}"><b>${esc(f.name)}</b><small>${c(f.id)} note</small></div>`).join("")}
const BELL='<svg viewBox="0 0 24 24"><path d="M6 17h12l-1.5-2V10a4.5 4.5 0 0 0-9 0v5L6 17zM10 20h4"/></svg>';
const chipsF=()=>`<div class="chips"><div class="chip ${!fsel?"on":""}" data-f="">Tutte le cartelle</div>${S.folders.map(f=>`<div class="chip ${fsel===f.id?"on":""}" data-f="${f.id}">${esc(f.name)}</div>`).join("")}</div>`;
const chipsT=()=>`<div class="chips">${[[0,"Sempre"],[7,"7 giorni"],[30,"30 giorni"]].map(c=>`<div class="chip ${tf===c[0]?"on":""}" data-tf="${c[0]}">${c[1]}</div>`).join("")}</div>`;
const TIMES=["07:00","08:00","09:00","12:00","18:00","20:00","21:00"];
function render(){
  const m=$("#m");document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.t===(tab==="notif"?"altro":tab)));
  const R=S.prefs.rem,P=S.prefs.push;
  if(tab==="note")m.innerHTML=`<div class="hd"><h1>CYBER WEB</h1><div class="hb"><div class="ic" id="bell">${BELL}${P?"":'<i class="dot"></i>'}</div><div class="ic a" id="av">${esc((S.prefs.name||"R")[0].toUpperCase())}</div></div></div><h2>${greet()}, ${esc(S.prefs.name)}</h2><p class="sub" id="sbt">// ${T("archivio neurale attivo","archivio attivo")}${ST?" · "+ST:""}</p>${stats()}<input id="q" placeholder="Filtra le note…" value="${esc(q)}"><div class="sec"><span>CARTELLE</span><a id="nf">+ NUOVA</a></div><div class="fl">${folderCards()}</div><div class="sec"><span>NOTE RECENTI</span><b id="cnt"></b></div><div id="nl"></div><button class="pri plus" id="nn">+ NUOVA NOTA</button>`;

    S.lastSync=Date.now();persist();setSt("☁ sincronizzato");
    const ae=document.activeElement;if(!document.querySelector(".ov")&&!(ae&&/INPUT|TEXTAREA/.test(ae.tagName)))render();else list();

const rid=id=>(S.folders.find(f=>f.id===id)||{}).rid||"";
const stateJson=()=>JSON.stringify({cartelle:S.folders.filter(f=>f.rid).map(f=>({id:f.rid,nome:f.name})),elementi:S.notes.filter(n=>n.rid).slice(0,150).map(n=>({id:n.rid,nome:(n.title||"").slice(0,60),tipo:"nota",cartella:rid(n.folder)})),cartella_aperta:rid(fsel),tema:S.prefs.theme,slang:!!S.prefs.slang});
function aiAdd(role,text){const m=$("#aim"),d=document.createElement("div");d.className="m "+role;if(role==="a")d.innerHTML=fmt(text);else d.textContent=text;m.appendChild(d);m.scrollTop=m.scrollHeight;return d}
function aiDecor(d,a){const b=document.createElement("button");b.textContent="Salva come nota";b.onclick=()=>{S.notes.push({id:uid(),title:"AI: "+a.replace(/\s+/g," ").slice(0,40),text:a,folder:"",created:Date.now(),updated:Date.now(),dirty:true});save();list();b.textContent="Nota salvata ✓";b.disabled=true};d.appendChild(b)}
function aiCard(p){const d=document.createElement("div");d.className="pc";d.innerHTML=`<div>⚠ ${esc(p.label)}</div>`;const ok=document.createElement("button"),no=document.createElement("button");ok.textContent="Conferma";ok.className="dng";no.textContent="Annulla";
  ok.onclick=async()=>{ok.disabled=no.disabled=true;try{const r=await A("execPending",{name:p.name,args:p.args});d.textContent=(r.ok?"✓ ":"✗ ")+r.message;sync()}catch(e){d.textContent="✗ Operazione non riuscita"}};
  no.onclick=()=>{d.textContent="Annullato."};d.append(ok,no);$("#aim").appendChild(d)}
function aiAct(list){list.forEach(a=>{const g=a.args||{};
  if(a.name==="navigate"){const f=S.folders.find(f=>f.rid===g.folder_id);if(g.folder_id!==undefined)fsel=f?f.id:"";if(g.query!==undefined)q=String(g.query);tab=g.query?"cerca":"note"}
  else if(a.name==="set_theme"){const k=({cyan:"ciano"})[g.color]||g.color;if(TH[k]){S.prefs.theme=k;theme()}}
  else if(a.name==="set_slang")S.prefs.slang=!!g.on});persist();if(!document.querySelector(".ov:not(#aiov)"))render()}
async function aiAsk(text){
  const f=S.ai.files.map(x=>x.id);if(!S.cloud.tok){aiAdd("s","Collega prima il Drive: Altro → Google Drive.");return}
  if(AI.busy)return;AI.busy=1;$("#aisend").disabled=true;S.ai.msgs.push({r:"u",t:text});aiAdd("u",text);const w=aiAdd("a",T("Hack in corso…","…"));w.classList.add("w");
  try{const res=await A("askAgent",S.ai.msgs,AI.ctx,!!S.prefs.slang,f,stateJson(),S.prefs.agent!==false),a=res.text||"Fatto.";
    S.ai.msgs.push({r:"a",t:a});S.ai.dirty=true;persist();w.classList.remove("w");w.innerHTML=fmt(a);aiDecor(w,a);
    (res.log||[]).forEach(l=>aiAdd("s","⚙ "+l));(res.pending||[]).forEach(aiCard);aiAct(res.actions||[]);if(res.changed)sync()}
  catch(e){S.ai.msgs.pop();persist();w.classList.remove("w");w.textContent=String(e.message||e).replace(/^Error:\s*/,"");if(/autorizzato/i.test(w.textContent)){S.cloud.tok="";persist();loginSheet("Sessione scaduta.")}}
  AI.busy=0;$("#aisend").disabled=false}
function aiFiles(){const b=$("#aif");b.innerHTML="";S.ai.files.forEach((f,i)=>{const c=document.createElement("div");c.className="chip";c.textContent="📎 "+f.name+" ✕";c.onclick=()=>{S.ai.files.splice(i,1);persist();aiFiles()};b.appendChild(c)})}
const AIQ=[["Riassumi le mie note","Riassumi le mie note e dimmi i punti più importanti."],["Organizza l’archivio","Guarda le mie note, proponi come organizzarle in cartelle e, se ti sembra sensato, fallo tu."],["Spiegami passo passo","Spiegami passo passo questo argomento: "]];
function openAI(note){
  if(document.querySelector("#aiov"))return;AI.ctx=note?"### "+(note.title||"Nota")+"\n"+note.text:"";
  const o=document.createElement("div");o.className="aiw";o.id="aiov";
  o.innerHTML=`<div class="aip"><div class="aih"><span>Cyber Web</span><div class="ia"><button class="ib s" id="aisv" title="Chat salvate">${ic("clock")}</button><button class="ib s" id="aigs" title="Impostazioni">${ic("gear")}</button><button class="ib s" id="aihp" title="Aiuto">${ic("help")}</button><button class="ib s" id="aib" title="Chiudi">${ic("x")}</button></div></div><div class="msgs" id="aim"></div><div id="aiv"></div><button class="ib" id="aidn">${ic("down")}</button><div class="chips" id="aif"></div><div class="aib"><button class="ib red" id="ain" title="Nuova chat">${ic("plus")}</button><div class="chips nw" id="aiq"></div></div><div class="aii"><input id="aii" placeholder="${T("Dimmi cosa ti serve, choom…","Chiedimi qualsiasi cosa…")}"><button class="ib s" id="aiat" title="Allega">${ic("img")}</button><button class="ib pu" id="mic" title="Detta">${ic("mic")}</button><button class="ib send" id="aisend" title="Invia">${ic("up")}</button></div><input type="file" id="aifi" multiple hidden></div>`;
  try{o.style.setProperty("--av",'url("data:image/svg+xml;utf8,'+encodeURIComponent(document.querySelector("#ai svg").outerHTML.replace("<svg","<svg xmlns='http://www.w3.org/2000/svg'"))+'")')}catch(e){}
  document.body.appendChild(o);
  const draw=()=>{$("#aim").innerHTML="";aiAdd("s",note?"Contesto: nota «"+(note.title||"senza titolo")+"»":T("Ehi choom! Sono il tuo netrunner: posso ragionare, scrivere, riassumere e gestire note e cartelle al posto tuo.","Ciao! Posso ragionare, scrivere, riassumere e gestire note e cartelle al posto tuo."));S.ai.msgs.forEach(m=>{const d=aiAdd(m.r==="a"?"a":"u",m.t);if(m.r==="a")aiDecor(d,m.t)});
    const qq=$("#aiq");qq.innerHTML="";if(!S.ai.msgs.length)(note?[["Riassumi","Riassumi questa nota in pochi punti."],["Correggi","Correggi errori e migliora la forma di questa nota."],["Checklist","Trasforma questa nota in una checklist."]]:AIQ).forEach(c=>{const e=document.createElement("div");e.className="chip";e.textContent=c[0];e.onclick=()=>{if(c[1].endsWith(": "))$("#aii").value=c[1];else aiAsk(c[1]);qq.innerHTML=""};qq.appendChild(e)});aiFiles()};
  draw();$("#aib").onclick=()=>o.remove();
  const tt=(b,warn,fn,need)=>{let a=0;const base=b.textContent;b.onclick=()=>{if(need&&!need()){fn();return}const ib=b.classList.contains("ib");if(!a){a=1;if(ib)toast(warn);else b.textContent=warn;setTimeout(()=>{a=0;if(!ib)b.textContent=base},3000);return}a=0;if(!ib)b.textContent=base;fn()}};
  const unsaved=()=>S.ai.dirty&&S.ai.msgs.length;
  tt($("#ain"),"Non salvata! Cancella?",()=>{S.ai={msgs:[],files:[]};AI.ctx="";persist();draw()},unsaved);
  const saveCh=async()=>{
    if(!S.cloud.tok){toast("Collega prima il Drive");return}
    const first=S.ai.msgs.find(m=>m.r==="u");if(!first){toast("Niente da salvare");return}
    const ti=S.ai.title||first.t.replace(/\s+/g," ").slice(0,45);
    try{S.ai.sid=await A("saveChat",S.ai.sid||"",ti,S.ai.msgs,AI.ctx,"",S.ai.files);S.ai.title=ti;S.ai.dirty=false;persist();toast("Chat salvata su Drive ✓")}catch(e){toast("Salvataggio non riuscito")}};
  const back=()=>o.classList.remove("lv");
  const chats=async()=>{
    if(!S.cloud.tok){toast("Collega prima il Drive");return}
    o.classList.add("lv");const v=$("#aiv");v.innerHTML="";
    const bk=document.createElement("button");bk.textContent="← Torna alla chat";bk.onclick=back;v.appendChild(bk);
    let L;try{L=await A("listChats")}catch(e){v.insertAdjacentHTML("beforeend",'<div class="empty">Non riesco a leggere le chat salvate.</div>');return}
    if(!L.length)v.insertAdjacentHTML("beforeend",'<div class="empty">Nessuna chat salvata. Usa <b>Salva</b> per conservare una conversazione.</div>');
    L.forEach(c=>{
      const d=document.createElement("div");d.className="card";
      d.innerHTML=`<b>${esc(c.name)}</b><div style="color:var(--mut);font-size:13px;margin:2px 0 10px">${new Date(c.updated).toLocaleString("it-IT",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</div><div class="row"><button class="op">Apri</button><button class="dng de">Elimina</button></div>`;
      tt(d.querySelector(".op"),"Non salvata! Apri?",async()=>{
        try{const x=await A("loadChat",c.id);S.ai={msgs:x.msgs||[],files:x.files||[],sid:x.id,title:x.title||"",dirty:false};AI.ctx=x.ctx||"";persist();back();draw()}catch(e){toast("Non riesco ad aprirla")}},unsaved);
      tt(d.querySelector(".de"),"Sicuro?",async()=>{try{await A("deleteChat",c.id);if(S.ai.sid===c.id)S.ai.sid="";persist();chats()}catch(e){toast("Eliminazione non riuscita")}});
      v.appendChild(d)})};
  $("#aisv").onclick=chats;
  o.onclick=e=>{if(e.target===o)o.remove()};
  $("#aii").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("#aisend").click()}};
  const ms=$("#aim"),dn=$("#aidn");ms.onscroll=()=>{dn.style.display=ms.scrollHeight-ms.scrollTop-ms.clientHeight>120?"grid":"none"};dn.onclick=()=>ms.scrollTo({top:ms.scrollHeight,behavior:"smooth"});
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  $("#mic").onclick=()=>{if(!SR){toast("Dettatura non supportata su questo dispositivo");return}const r=new SR();r.lang="it-IT";r.onresult=e=>{const i=$("#aii");i.value+=(i.value?" ":"")+e.results[0][0].transcript;i.focus()};r.onerror=()=>toast("Microfono non disponibile");r.start();toast("Parla pure…")};
  $("#aigs").onclick=()=>sheet(`<h3 style="margin:0">Impostazioni AI</h3><button id="gs">Salva questa chat su Drive</button><div class="sw"><span>L’AI può agire sull’app</span><input type="checkbox" id="g1" ${S.prefs.agent!==false?"checked":""}></div><div class="sw"><span>Slang di Night City</span><input type="checkbox" id="g2" ${S.prefs.slang?"checked":""}></div>`,s=>{s.querySelector("#gs").onclick=()=>{s.remove();saveCh()};s.querySelector("#g1").onchange=e=>{S.prefs.agent=e.target.checked;save()};s.querySelector("#g2").onchange=e=>{S.prefs.slang=e.target.checked;save()}});
  $("#aihp").onclick=()=>sheet(`<h3 style="margin:0">Come usare l’assistente</h3><p style="color:var(--mut);margin:0">Scrivi o detta una richiesta. Allega file con l’icona immagine, apri le chat salvate con l’orologio e salva la conversazione dalle impostazioni. L’AI può creare e spostare note, ma chiede conferma prima di eliminare.</p>`);
  $("#aisend").onclick=()=>{const v=$("#aii").value.trim();if(v){$("#aii").value="";$("#aiq").innerHTML="";aiAsk(v)}};
  $("#aiat").onclick=()=>$("#aifi").click();
  $("#aifi").onchange=async e=>{for(const f of e.target.files){if(f.size>8e6||/\.(docx?|xlsx?|pptx?|zip|rar|7z|exe)$/i.test(f.name)){toast(f.name+": non supportato (max 8 MB, no Office)");continue}
    if(!S.cloud.tok){toast("Collega prima il Drive");break}
    try{toast("Carico "+f.name+"…");const b64=await new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=ko;r.readAsDataURL(f)});
      S.ai.files.push({id:await A("aiUpload",f.name,f.type,b64),name:f.name});persist();aiFiles()}catch(x){toast("Caricamento non riuscito")}}e.target.value=""};
}
document.addEventListener("change",e=>{if(e.target.id==="ag"){S.prefs.agent=e.target.checked;save()}});
theme();render();tick();boot();
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
